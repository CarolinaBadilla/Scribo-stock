name: DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'k8s/**'
      - '.github/workflows/deploy.yml'

permissions:
  id-token: write   # Requerido obligatoriamente para autenticación OIDC
  contents: write    # Para clonar el código

jobs:
  security-audit:
    name: Security Shift-Left Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (Secret Detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-deploy:
    name: Build, Scan & Deploy
    needs: security-audit
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
      ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_ARN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials (OIDC Passwordless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract Image Metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "IMAGE_TAG=${SHORT_SHA}" >> $GITHUB_ENV
          echo "REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV

      # --- BACKEND BUILD & SCAN ---
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/stock-saas/backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Backend Image with Trivy (Vulnerabilities)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/stock-saas/backend:${{ env.IMAGE_TAG }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Backend Image to ECR
        run: |
          docker push ${{ env.REGISTRY }}/stock-saas/backend:${{ env.IMAGE_TAG }}

      # --- FRONTEND BUILD & SCAN ---
      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/stock-saas/frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push Frontend Image to ECR
        run: |
          docker push ${{ env.REGISTRY }}/stock-saas/frontend:${{ env.IMAGE_TAG }}

      # --- GITOPS: ACTUALIZAR MANIFIESTO EN GIT PARA ARGOCD ---
      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update Image Tags in Kustomize & Push to Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Actualizar los tags de imagen en k8s/overlays/prod/kustomization.yaml
          cd k8s/overlays/prod
          kustomize edit set image ${{ env.REGISTRY }}/stock-saas/backend=${{ env.REGISTRY }}/stock-saas/backend:${{ env.IMAGE_TAG }}
          kustomize edit set image ${{ env.REGISTRY }}/stock-saas/frontend=${{ env.REGISTRY }}/stock-saas/frontend:${{ env.IMAGE_TAG }}
          
          # Commitear y pushear el cambio para que ArgoCD lo tome
          cd ../../..
          git add k8s/overlays/prod/kustomization.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(gitops): bump images to ${{ env.IMAGE_TAG }} [skip ci]" && git push origin main)s