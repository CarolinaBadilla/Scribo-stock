version: '3.8'

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: scribo_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Se eliminan los puertos mapeados al exterior por seguridad. 
    # Solo el backend se comunica internamente con la BD.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./bd/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build: ./backend
    container_name: scribo_backend
    restart: always
    environment:
      PORT: ${PORT}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}"
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3002:3000" # 👈 Cambiado a 3002 (3000 y 3001 están en uso en tu VPS)
    depends_on:
      - postgres_db

  frontend:
    build: ./frontend
    container_name: scribo_frontend
    restart: always
    ports:
      - "8082:80" # 👈 Cambiado a 8082 (80, 8080 y 8081 están en uso en tu VPS)
    depends_on:
      - backend

volumes:
  postgres_data: