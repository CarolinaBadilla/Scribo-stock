name: scribo_stock_prod

services:
  # Base de datos (Totalmente aislada, accesible SOLO dentro del stack)
  postgres_db:
    image: postgres:16-alpine
    container_name: scribo_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Scribo_db_pass_super_segura_2026}
      POSTGRES_DB: ${POSTGRES_DB:-scribo_db}
    volumes:
      - scribo_postgres_data:/var/lib/postgresql/data
    networks:
      - scribo_isolated_net

  # Backend Express (Accesible por Nginx mediante la red proxy-net en el puerto 3000)
  backend:
    build:
      context: ./backend
    container_name: scribo_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-Scribo_db_pass_super_segura_2026}@postgres_db:5432/${POSTGRES_DB:-scribo_db}?schema=public
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-secreto_super_seguro_scribo_2026}
    depends_on:
      - postgres_db
    networks:
      - scribo_isolated_net
      - proxy_net

  # Frontend React (Accesible por Nginx mediante la red proxy-net en el puerto 80)
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-https://api.scribo.com.ar/api}
    container_name: scribo_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - scribo_isolated_net
      - proxy_net

volumes:
  scribo_postgres_data:
    name: scribo_postgres_data_vol

networks:
  # Red privada interna para la comunicación interna entre Backend y Postgres
  scribo_isolated_net:
    name: scribo_isolated_network
    driver: bridge

  # Red externa de Nginx Proxy Manager existente en tu Docker
  proxy_net:
    external: true
    name: proxy-net