apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-backup-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::512902043510:role/ScriboPostgresBackupRole
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-s3-backup
spec:
  # Ejecuta todos los días a las 03:00 UTC (00:00 hora de Argentina)
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: postgres-backup-sa
          restartPolicy: OnFailure
          containers:
          - name: postgres-backup
            image: amazon/aws-cli:latest
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -e
                echo "Instalando dependencias (postgresql client y gzip)..."
                yum install -y postgresql15 gzip || yum install -y postgresql gzip
                
                TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                BACKUP_FILE="/tmp/scribo_db_${TIMESTAMP}.sql.gz"
                
                echo "Generando backup de scribo_db..."
                PGPASSWORD="${PGPASSWORD}" pg_dump -h postgres-service -U postgres -d scribo_db | gzip > "${BACKUP_FILE}"
                
                echo "Subiendo a Amazon S3..."
                aws s3 cp "${BACKUP_FILE}" s3://scribo-db-backups-512902043510/backups/scribo_db_${TIMESTAMP}.sql.gz
                
                echo "Backup completado exitosamente: scribo_db_${TIMESTAMP}.sql.gz"
                rm -f "${BACKUP_FILE}"
            env:
              - name: PGPASSWORD
                valueFrom:
                  secretKeyRef:
                    name: app-secrets
                    key: DB_PASSWORD